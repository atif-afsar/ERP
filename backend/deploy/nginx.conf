# =====================================================================
# EduNexus ERP — Production Nginx Reverse Proxy & Static Host Configuration
# Place in: /etc/nginx/sites-available/edunexus.conf
# Symlink:  sudo ln -s /etc/nginx/sites-available/edunexus.conf /etc/nginx/sites-enabled/
# =====================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Node.js Express cluster (PM2 managed)
upstream edunexus_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ---------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name erp.edunexus.example.com api.edunexus.example.com;

    # ACME-challenge for Let's Encrypt Certbot renewals
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# 2. Main HTTPS Production Server (SPA + API Reverse Proxy)
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.edunexus.example.com;

    # SSL Certificates (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/erp.edunexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.edunexus.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/erp.edunexus.example.com/chain.pem;

    # SSL Protocols & Ciphers (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-src https://api.razorpay.com;" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # Upload Limit (Explicitly aligned with Express JSON/urlencoded 12mb limit)
    client_max_body_size 12M;

    # Static Frontend SPA Hosting
    root /var/www/edunexus/frontend/dist;
    index index.html;

    # Correct route refresh behavior for SPA (Vite / React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (Vite hashed bundles)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|ico|cur|gz|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Proxy Routing (/api and /api/v1)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://edunexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Strict Auth Endpoint Rate Limiting
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://edunexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Readiness & Liveness Health Checks
    location ~ ^/(health|readiness)$ {
        access_log off;
        proxy_pass http://edunexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
