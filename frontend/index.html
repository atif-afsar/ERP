        <h1>EzyAura – School &amp; Coaching ERP Software in India</h1>
        <p>EzyAura is one operating system for your entire institute. It brings admissions, academics, attendance, fees, results and staff operations into one clear workspace for every role: owners, teachers, accountants, staff, parents and students. Please enable JavaScript to use the app.</p>
        <h2>Features</h2>
        <ul>
          <li><strong>Students and families:</strong> admissions, yearly enrollment, parent and student logins, documents, and Excel/CSV import.</li>
          <li><strong>Attendance and timetable:</strong> daily class attendance, a clash-free weekly timetable, and QR check-in for coaching batches.</li>
          <li><strong>Fees with UPI proof:</strong> fee plans, installments and concessions. Parents pay by UPI or bank transfer, upload proof, and get a receipt once the school approves.</li>
          <li><strong>Exams and results:</strong> exam schedules, teacher marks entry, automatic grades and published CBSE-style report cards.</li>
          <li><strong>Homework and notices:</strong> teachers post homework, the office sends notices, and parents see both in their portal.</li>
          <li><strong>Staff and HR:</strong> staff records, leave, staff attendance and monthly payroll with payslips.</li>
          <li><strong>Reports and control:</strong> student, attendance, fee and exam reports with CSV export, role-based access and an audit trail.</li>
        </ul>
        <h2>Pricing</h2>
        <ul>
          <li><strong>Starter – ₹1,999/month:</strong> up to 300 active students, all modules.</li>
          <li><strong>Growth – ₹3,999/month:</strong> up to 1,000 active students, adds QR attendance for coaching batches.</li>
          <li><strong>Pro – ₹6,999/month:</strong> unlimited students.</li>
        </ul>
        <h2>Frequently asked questions</h2>
        <h3>Who is EzyAura built for?</h3>
        <p>EzyAura is designed for schools and coaching institutes that want one simple system for students, attendance, fees, exams and parent communication.</p>
        <h3>How are fee payments handled?</h3>
        <p>Schools publish their bank or UPI details. Parents pay through their preferred banking app, upload proof, and receive a receipt after an authorized administrator verifies the payment.</p>
        <h3>Does EzyAura support parents and students?</h3>
        <p>Yes. Linked parent and student accounts see their own attendance, homework, published results and fee status.</p>
